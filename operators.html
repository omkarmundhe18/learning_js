<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var a = 10;
      var b = 4;
      var c = a * b; //binary
      c++; //unary
      c++;
      c++;
      c--;
      c++;
      c--;
      c++; // +19 -9 *43
      document.write(c);
    </script>

    <!-- Assignment Operotors -->

    <script>
      var x = 10;
      var y = 12;
      x += y;
      document.write(x + "<br>");
      document.write(y);
    </script>

    <!-- comparison Operotors - <,>,<=,==,=== -->

    <script>
      var p = 17;
      var q = "17";

      document.write("<br>");
      if (p == q) {
        document.write("true");
      } else {
        document.write("false");
      }
    </script>

    <!-- logical Operotors && , || , !  -->

    <script>
        var age = 22;
        if(age >= 18 && age <=100){
            document.write("Eligible for Vote");
        }else{
            document.write("Not Eligible");
        }
    </script>

    <script>
        document.write("<br>");
        var day = "sunday";
        if(day === "saturday" || day === "sunday"){
            document.write("Its Weekend");
        }else{
            document.write("Its Weekdays");
        }
    </script>

    <script>
        document.write("<br>");
        let our_age = 16;
        let eligibility = (our_age >= 18) ? "Eligible for vote" : "not eligibe";
        document.write(eligibility);
    </script>
  </body>
</html>
