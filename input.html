<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Contact Information</legend>
            <form>
                <label>Enter Name</label>
        <input type="text" placeholder="Enter Name" >

        <label>Enter Email</label>
        <input type="Email" placeholder="Enter Email" >
        <br><br>
        <label>Aadhar Number</label>
        <input type="Number" placeholder="Enter Aadhar NUmber" >

        <label> Enter Password</label>
        <input type="password" placeholder="Enter password" >
        <br><br>

        <label>Enter date</label>
        <input type="date">

        <label>Enter month</label>
        <input type="month">

        <label>Enter week</label>
        <input type="week">

        <label>Enter Time</label>
        <input type="time">

        <label>Enter Date and time</label>
        <input type="datetime-local">

        <br><br>

        <label>Choose Cities</label>
        <input type="checkbox">Mumbai
        <input type="checkbox">Pune
        <input type="checkbox">Nashik
        <input type="checkbox">Delhi
        <br><br>
        <label>Select Gender</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female
        <input type="radio" name="Gender">Other

        <br>
            </form>
        </legend>
    </fieldset>
</body>
</html>
